; PHP settings of the browser suite's web server (scripts/test-browser-e2e.sh), identical locally and in CI.
; GitHub's setup-php enables the tracing JIT by default (opcache.jit=1235, jit_buffer_size=256M). With it,
; PHP 8.2's built-in server workers crash in the Zend VM (SIGSEGV in execute_ex) while serving WordPress
; core requests such as the login POST — reproduced locally on 2026-09-30, and the cause of CI's
; "net::ERR_EMPTY_RESPONSE". The JIT is therefore kept at PHP's own default (off); OPcache itself stays on
; wherever it is loaded, like on a production web server.
opcache.jit=disable
opcache.jit_buffer_size=0
