name: Quality

# The complete release-quality pipeline. It runs on pushes and pull requests and is also
# called by release.yml, which publishes the exact ZIP built and tested here (by SHA-256).

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      require_sandbox:
        description: Fail when the real Plaid Sandbox gate cannot run (release builds).
        type: boolean
        default: false
    outputs:
      zip_name:
        description: File name of the tested release ZIP.
        value: ${{ jobs.package.outputs.zip_name }}
      zip_sha256:
        description: SHA-256 of the tested release ZIP.
        value: ${{ jobs.package.outputs.zip_sha256 }}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

env:
  BUCKMERCE_PLAID_TEST_DB_HOST: 127.0.0.1:3306
  BUCKMERCE_PLAID_TEST_DB_USER: root
  # Throwaway password of the CI-only database service containers; not a secret.
  BUCKMERCE_PLAID_TEST_DB_PASSWORD: buckmerce-ci-only
  # vendor-prefixed/composer/InstalledVersions.php is copied from Composer's own runtime, so the
  # committed prefixed tree is reproducible only with this exact Composer version.
  COMPOSER_VERSION: '2.10.3'

jobs:
  composer-validation:
    name: Composer validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:2.10.3
          coverage: none
      - name: The pinned Composer version generates vendor-prefixed/
        run: composer --version | grep -F "Composer version $COMPOSER_VERSION "
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Prefixed runtime dependencies are committed and current (composer.lock + Strauss → vendor-prefixed/)
        # installed.php embeds the root commit hash, which changes with every commit.
        run: |
          git diff --exit-code -- vendor-prefixed ':!vendor-prefixed/composer/installed.php'
          untracked=$(git ls-files --others --exclude-standard -- vendor-prefixed)
          [[ -z "$untracked" ]] || { echo "::error::Generated but uncommitted files in vendor-prefixed/:"; echo "$untracked"; exit 1; }

  php-syntax:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - run: find src tests buckmerce-plaid.php uninstall.php -name '*.php' -not -path 'tests/phpstan-wp-root/*' -print0 | xargs -0 -n1 php -l > /dev/null

  scripts-lint:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x -P SCRIPTDIR -S warning scripts/*.sh scripts/lib/*.sh

  phpcs:
    name: PHPCS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint

  phpstan:
    name: PHPStan (level 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer stan

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        experimental: [false]
        include:
          # PHP 8.5 runs as an early-warning job; it is not claimed as supported.
          - php: '8.5'
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Source and credentials audit
        run: bash scripts/audit-source.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:2.10.3
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Composer runtime dependencies (shipped in the ZIP)
        run: composer audit --locked --no-dev
      - name: Composer development dependencies
        run: composer audit --locked
      - name: npm dependencies (build toolchain of the shipped assets)
        run: npm audit --audit-level=high

  frontend-build:
    name: Front-end build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  javascript-lint:
    name: JavaScript lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build, typecheck, syntax-check the compiled bundles and run the JavaScript tests
        run: npm test

  package:
    name: Package (build once, verify, hash)
    runs-on: ubuntu-24.04
    outputs:
      zip_name: ${{ steps.hash.outputs.zip_name }}
      zip_sha256: ${{ steps.hash.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:2.10.3
          coverage: none
      - uses: ./.github/actions/setup-wp-cli
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Translations match the sources, are complete and compiled (languages/)
        env:
          BUCKMERCE_PLAID_REQUIRE_WP_CLI: '1'
        run: bash scripts/check-translations.sh
      - name: Build the release ZIP (fresh assets, deterministic zip)
        run: npm run plugin-zip
      - name: Verify contents, source parity, fresh-asset parity, PHP lint and record SHA-256
        run: bash scripts/verify-package.sh
      - id: hash
        name: Publish the artifact identity
        shell: bash
        run: |
          zip=$(ls dist/buckmerce-plaid-*.zip)
          echo "zip_name=$(basename "$zip")" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$(cut -d' ' -f1 "$zip.sha256")" >> "$GITHUB_OUTPUT"
          echo "### Release artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(cat "$zip.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: buckmerce-plaid-zip
          path: |
            dist/buckmerce-plaid-*.zip
            dist/buckmerce-plaid-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  package-smoke:
    name: Pristine install smoke (WP ${{ matrix.wordpress }}, WC ${{ matrix.woocommerce }}, PHP ${{ matrix.php }})
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported stack (WooCommerce 8.7) and the latest stable stack. Each
          # runs a fresh HPOS store and a fresh legacy-storage store.
          - { php: '8.1', wordpress: '6.6', woocommerce: '8.7.0' }
          - { php: '8.4', wordpress: '7.1.2', woocommerce: '11.1.2' }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: buckmerce-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BUCKMERCE_PLAID_TEST_WP_VERSION: '${{ matrix.wordpress }}'
      BUCKMERCE_PLAID_TEST_WC_VERSION: '${{ matrix.woocommerce }}'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mysqli, mbstring, dom, gd
          tools: composer:2.10.3
          coverage: none
      - uses: ./.github/actions/setup-wp-cli
      - uses: actions/download-artifact@v8
        with:
          name: buckmerce-plaid-zip
          path: dist
      - run: bash scripts/test-package-smoke.sh

  source-package-parity:
    name: Source/package parity
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: buckmerce-plaid-zip
          path: dist
      - name: The uploaded ZIP still matches its hash and a fresh build of this commit
        shell: bash
        run: |
          zip=$(ls dist/buckmerce-plaid-*.zip)
          (cd dist && sha256sum -c "$(basename "$zip").sha256")
          bash scripts/verify-package.sh "$zip"
          # Reproducible build: rebuilding this commit gives the same bytes as the tested artifact.
          npm run build
          BUCKMERCE_PLAID_DIST_DIR=rebuild bash scripts/package.sh
          cmp "rebuild/$(basename "$zip")" "$zip"
          echo "Rebuild is byte-identical: $(sha256sum "$zip" | cut -d' ' -f1)"

  integration-mysql:
    name: Integration MySQL ${{ matrix.mysql }} (WP ${{ matrix.wordpress }}, WC ${{ matrix.woocommerce }}, PHP ${{ matrix.php }})
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported (WooCommerce 8.7), an intermediate combination and the latest stable stack.
          - { php: '8.1', wordpress: '6.6', woocommerce: '8.7.0', mysql: '8.0' }
          - { php: '8.3', wordpress: '6.8', woocommerce: '9.9.5', mysql: '8.0' }
          - { php: '8.2', wordpress: '7.1.2', woocommerce: '11.1.2', mysql: '8.4' }
          - { php: '8.4', wordpress: '7.1.2', woocommerce: '11.1.2', mysql: '8.4' }
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: buckmerce-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BUCKMERCE_PLAID_TEST_WP_VERSION: '${{ matrix.wordpress }}'
      BUCKMERCE_PLAID_TEST_WC_VERSION: '${{ matrix.woocommerce }}'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mysqli, mbstring, dom, gd
          tools: composer:2.10.3
          coverage: none
      - uses: ./.github/actions/setup-wp-cli
      - uses: actions/download-artifact@v8
        with:
          name: buckmerce-plaid-zip
          path: dist
      - name: ZIP install, HPOS on/off, payments, refunds, lifecycle, webhooks, concurrency, migration, uninstall
        run: bash scripts/test-integration.sh

  integration-mariadb:
    name: Integration MariaDB ${{ matrix.mariadb }} (WP ${{ matrix.wordpress }}, WC ${{ matrix.woocommerce }}, PHP ${{ matrix.php }})
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', wordpress: '6.6', woocommerce: '8.7.0', mariadb: '10.11' }
          - { php: '8.3', wordpress: '7.1.2', woocommerce: '11.1.2', mariadb: '11.4' }
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: buckmerce-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BUCKMERCE_PLAID_TEST_WP_VERSION: '${{ matrix.wordpress }}'
      BUCKMERCE_PLAID_TEST_WC_VERSION: '${{ matrix.woocommerce }}'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mysqli, mbstring, dom, gd
          tools: composer:2.10.3
          coverage: none
      - uses: ./.github/actions/setup-wp-cli
      - uses: actions/download-artifact@v8
        with:
          name: buckmerce-plaid-zip
          path: dist
      - name: Same suites on MariaDB (schema, reservations, advisory locks, event leases, reconciliation, uninstall)
        run: bash scripts/test-integration.sh

  plugin-check:
    name: WordPress Plugin Check (release ZIP)
    needs: package
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: buckmerce-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, dom, gd
          tools: composer:2.10.3
          coverage: none
      - uses: ./.github/actions/setup-wp-cli
      - uses: actions/download-artifact@v8
        with:
          name: buckmerce-plaid-zip
          path: dist
      - run: bash scripts/test-plugin-check.sh

  browser-e2e:
    # One browser run covers the Classic Checkout gate, the Checkout Blocks gate and the
    # accessibility checks (axe-core, keyboard, focus) of Buckmerce-owned UI.
    name: Browser E2E (Classic + Blocks checkout, admin refunds, accessibility)
    needs: package
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: buckmerce-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BUCKMERCE_PLAID_TEST_WP_VERSION: '7.1.2'
      BUCKMERCE_PLAID_TEST_WC_VERSION: '11.1.2'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, dom, gd
          tools: composer:2.10.3
          coverage: none
      - uses: ./.github/actions/setup-wp-cli
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: buckmerce-plaid-zip
          path: dist
      - run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Allow core dumps of the PHP server (a crash is reported with a backtrace)
        run: |
          sudo apt-get install -y -qq gdb >/dev/null
          echo '/tmp/core.%e.%p' | sudo tee /proc/sys/kernel/core_pattern >/dev/null
      - run: bash scripts/test-browser-e2e.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-output
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7

  sandbox:
    name: Real Plaid Sandbox
    needs: package
    # Secrets are never exposed to forked pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      # 'true' only when the gate really ran against Plaid Sandbox and passed; a green job that
      # skipped the gate (no secrets on a push/PR) reports 'false' and is never counted as executed.
      executed: ${{ steps.gate.outputs.executed }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: buckmerce-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BUCKMERCE_PLAID_SANDBOX_CLIENT_ID: ${{ secrets.BUCKMERCE_PLAID_SANDBOX_CLIENT_ID }}
      BUCKMERCE_PLAID_SANDBOX_SECRET: ${{ secrets.BUCKMERCE_PLAID_SANDBOX_SECRET }}
      BUCKMERCE_PLAID_SANDBOX_USERNAME: ${{ secrets.BUCKMERCE_PLAID_SANDBOX_USERNAME }}
      BUCKMERCE_PLAID_SANDBOX_PASSWORD: ${{ secrets.BUCKMERCE_PLAID_SANDBOX_PASSWORD }}
      # Name of the Sandbox Link customization (Account Select "Enabled for one account"). Not a
      # secret: a repository variable, or a secret of the same name.
      BUCKMERCE_PLAID_SANDBOX_LINK_CUSTOMIZATION: ${{ vars.BUCKMERCE_PLAID_SANDBOX_LINK_CUSTOMIZATION || secrets.BUCKMERCE_PLAID_SANDBOX_LINK_CUSTOMIZATION }}
      # Optional public-HTTPS webhook gate (genuine Plaid-signed webhooks through ngrok).
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      BUCKMERCE_PLAID_NGROK_DOMAIN: ${{ vars.BUCKMERCE_PLAID_NGROK_DOMAIN }}
      REQUIRE_SANDBOX: ${{ inputs.require_sandbox && 'true' || 'false' }}
      BUCKMERCE_PLAID_TEST_WP_VERSION: '7.1.2'
      BUCKMERCE_PLAID_TEST_WC_VERSION: '11.1.2'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, dom, gd
          tools: composer:2.10.3
          coverage: none
      - uses: ./.github/actions/setup-wp-cli
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: buckmerce-plaid-zip
          path: dist
      - run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Install ngrok
        if: env.NGROK_AUTHTOKEN != '' && env.BUCKMERCE_PLAID_NGROK_DOMAIN != ''
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" | sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq ngrok
      - id: gate
        name: Real Plaid Sandbox E2E (payments, returns, refunds)
        shell: bash
        run: |
          set +e
          echo "executed=false" >> "$GITHUB_OUTPUT"
          mode=''
          if [[ -n "$NGROK_AUTHTOKEN" && -n "$BUCKMERCE_PLAID_NGROK_DOMAIN" ]]; then
            mode='--ngrok'
          fi
          bash scripts/test-sandbox-e2e.sh $mode
          status=$?
          if [[ "$status" -eq 78 ]]; then
            if [[ "$REQUIRE_SANDBOX" == 'true' ]]; then
              echo "::error::The real Plaid Sandbox gate is required for a release but its secrets are not configured."
              exit 1
            fi
            echo "::notice::Plaid Sandbox secrets are not configured; the real Sandbox gate was NOT EXECUTED."
            echo "### Real Plaid Sandbox: NOT EXECUTED (inputs not configured)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$status" -eq 0 ]]; then
            echo "executed=true" >> "$GITHUB_OUTPUT"
            echo "### Real Plaid Sandbox: EXECUTED${mode:+ (genuine signed webhooks through a public HTTPS tunnel)}" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-output
          path: |
            output/playwright/sandbox-server.log
            output/playwright/ngrok.log
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality Gate
    needs:
      - composer-validation
      - php-syntax
      - scripts-lint
      - phpcs
      - phpstan
      - phpunit
      - dependency-audit
      - frontend-build
      - typecheck
      - javascript-lint
      - package
      - package-smoke
      - source-package-parity
      - integration-mysql
      - integration-mariadb
      - plugin-check
      - browser-e2e
      - sandbox
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job succeeded
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRE_SANDBOX: ${{ inputs.require_sandbox && 'true' || 'false' }}
          SANDBOX_EXECUTED: ${{ needs.sandbox.outputs.executed }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          echo "Real Plaid Sandbox executed: ${SANDBOX_EXECUTED:-false}"
          for job in composer-validation php-syntax scripts-lint phpcs phpstan phpunit dependency-audit frontend-build typecheck javascript-lint package package-smoke source-package-parity integration-mysql integration-mariadb plugin-check browser-e2e; do
            result=$(echo "$RESULTS" | jq -r --arg job "$job" '.[$job].result')
            [[ "$result" == success ]] || { echo "::error::$job: $result"; exit 1; }
          done
          # The Sandbox gate is skipped for pull requests from forks (they never receive the secrets).
          result=$(echo "$RESULTS" | jq -r '.sandbox.result')
          [[ "$result" == success || "$result" == skipped ]] || { echo "::error::sandbox: $result"; exit 1; }
          # A release needs the real Sandbox gate to have RUN and passed; a skipped job is not a pass.
          if [[ "$REQUIRE_SANDBOX" == 'true' && "$SANDBOX_EXECUTED" != 'true' ]]; then
            echo "::error::The real Plaid Sandbox gate did not execute; a release requires it."
            exit 1
          fi
