name: Release

# A tag can only publish the ZIP that the complete quality pipeline built and tested in this
# same workflow run: quality.yml builds it once, records its SHA-256, runs every gate on it
# (including the real Plaid Sandbox gate, required here, and with security advisories and an
# outdated "Tested up to" blocking instead of warning), and this job publishes that file
# after re-checking the hash. Nothing is rebuilt after testing.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag and version metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag commit belongs to master
        shell: bash
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::Release tags must point to a commit contained in master."; exit 1; }
      - id: version
        name: Tag, plugin header, constant, readme Stable tag, package.json and changelog agree
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "::error::Invalid release tag $GITHUB_REF_NAME"; exit 1; }
          header=$(grep -m1 '^ \* Version:' buckmerce-plaid.php | sed -E 's/^ \* Version:[[:space:]]*//')
          constant=$(grep -m1 "define( 'BUCKMERCE_PLAID_VERSION'" buckmerce-plaid.php | sed -E "s/.*'BUCKMERCE_PLAID_VERSION',[[:space:]]*'([^']+)'.*/\1/")
          stable=$(grep -m1 '^Stable tag:' readme.txt | sed -E 's/^Stable tag:[[:space:]]*//')
          package=$(node -p "require('./package.json').version")
          for pair in "header:$header" "constant:$constant" "readme:$stable" "package.json:$package"; do
            [[ "${pair#*:}" == "$VERSION" ]] || { echo "::error::${pair%%:*} version ${pair#*:} != tag $VERSION"; exit 1; }
          done
          # readme.txt is tracked and shipped in the ZIP; its changelog is the release changelog.
          grep -qxF "= $VERSION =" readme.txt || { echo "::error::readme.txt has no changelog section for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          [[ "$VERSION" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  quality:
    name: Full quality gate
    needs: verify-tag
    uses: ./.github/workflows/quality.yml
    with:
      require_sandbox: true
      release: true
    secrets: inherit

  release:
    name: Publish the tested ZIP
    needs: [verify-tag, quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: buckmerce-plaid-zip
          path: dist
      - name: The artifact is the tested one
        shell: bash
        env:
          EXPECTED_NAME: ${{ needs.quality.outputs.zip_name }}
          EXPECTED_SHA: ${{ needs.quality.outputs.zip_sha256 }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          [[ "$EXPECTED_NAME" == "buckmerce-plaid-$VERSION.zip" ]] || { echo "::error::Tested ZIP $EXPECTED_NAME does not match version $VERSION"; exit 1; }
          actual=$(sha256sum "dist/$EXPECTED_NAME" | cut -d' ' -f1)
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo "::error::SHA-256 mismatch: tested $EXPECTED_SHA, about to publish $actual"; exit 1; }
          (cd dist && sha256sum -c "$EXPECTED_NAME.sha256")
          echo "Publishing $EXPECTED_NAME ($actual)" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
          SHA: ${{ needs.quality.outputs.zip_sha256 }}
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            "dist/buckmerce-plaid-$VERSION.zip" \
            "dist/buckmerce-plaid-$VERSION.zip.sha256" \
            --title "Plaid for WooCommerce $VERSION" \
            --notes "Release ZIP SHA-256: \`$SHA\` (built and tested once by the quality gate of this workflow run). See the changelog in readme.txt." \
            --verify-tag "${flags[@]}"
